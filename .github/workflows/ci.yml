name: CI

on: [push, pull_request]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-check:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check required files and no secrets
        run: bash scripts/check-repo.sh
      - name: Secret scan (gitleaks)
        if: github.event_name == 'push'
        uses: gitleaks/gitleaks-action@v2

  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy .
      - name: Security scan
        run: |
          pip-audit || true
          bandit -r . -ll || true
      - name: Tests with coverage gate
        run: pytest --cov=. --cov-fail-under=80

  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests with coverage gate
        run: npm run test:cov
      - name: Security scan
        run: npm audit --audit-level=high || true
      - name: Build PWA
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-build
          path: frontend/dist

  e2e:
    name: E2E (mobile viewports)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Install frontend deps + browsers
        run: |
          npm ci
          npm install -D @playwright/test
          npx playwright install --with-deps chromium
      - name: Run e2e
        run: npm run e2e
